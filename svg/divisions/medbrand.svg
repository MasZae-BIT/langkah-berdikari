<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="medbrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC8129"/>
      <stop offset="100%" stop-color="#C05C10"/>
    </linearGradient>
    <filter id="medbrandShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#medbrandGrad)" filter="url(#medbrandShadow)"/>
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Media / Camera / Screen Symbol -->
  <g transform="translate(60, 50) scale(1.4)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-10" y="-8" width="20" height="14" rx="2" fill="rgba(255, 255, 255, 0.15)"/>
    <line x1="-4" y1="10" x2="4" y2="10"/>
    <line x1="0" y1="6" x2="0" y2="10"/>
    <circle cx="0" cy="-1" r="2.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Text Label -->
  <text x="60" y="98" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">MEDBRAND</text>
</svg>
