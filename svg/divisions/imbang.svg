<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="imbangGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2E4F"/>
      <stop offset="100%" stop-color="#192338"/>
    </linearGradient>
    <filter id="imbangShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#imbangGrad)" filter="url(#imbangShadow)"/>
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="#FDE053" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Business & Finance Symbol (Coin / Growth) -->
  <g transform="translate(60, 48) scale(1.4)" stroke="#FDE053" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-11" x2="0" y2="11"/>
    <path d="M5 -7 H-2.5 a3.5 3.5 0 0 0 0 7 h5 a3.5 3.5 0 0 1 0 7 H-6"/>
  </g>
  
  <!-- Text Label -->
  <text x="60" y="98" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">IMBANG</text>
</svg>
