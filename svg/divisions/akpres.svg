      <stop offset="0%" stop-color="#31487A"/>
      <stop offset="100%" stop-color="#1E2E4F"/>
    </linearGradient>
    <filter id="akpresShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#akpresGrad)" filter="url(#akpresShadow)"/>
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="#FDE053" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Academic Trophy & Star Symbol -->
  <g transform="translate(60, 48) scale(1.4)" stroke="#FDE053" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-6 -9 h12 v7 a6 6 0 0 1 -12 0 Z" fill="rgba(253, 224, 83, 0.2)"/>
