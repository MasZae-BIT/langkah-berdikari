    <line x1="-4" y1="9" x2="4" y2="9"/>
  </g>
  
  <!-- Text Label -->
  <text x="60" y="98" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">AKPRES</text>
